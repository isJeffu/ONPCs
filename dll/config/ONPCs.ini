; OStim NPCs Reforged - settings. Edited in game on the F3 menu (SKSE Menu Framework) or here.
; The DLL rewrites this file whenever a value changes in the menu.

[General]
; 1 = no automatic scenes and no cell polling (match-maker spells still work)
bDisabled = false
; followers have scenes between themselves
bAllowActiveFollowers = false
; the player's lover or spouse may be picked for NPC scenes
bAllowPlayersPartners = false
; followers may pair with other NPCs
bActiveFollowersEngageOtherNPCs = false
; elders may be picked
bAllowElderRace = false
; bandits, warlocks etc. have scenes in their camps
bAllowCommonEnemies = true
; 0.1.3: each NPC has at most one scene a night (false = after the short break, their arousal decides whether they go again)
bOneScenePerNight = true
; NPC scenes end, or never start, when the player is detected
bStopWhenFound = true
; NPCs walk to the furniture first
bTravelToLocation = true
; enemies walk to the furniture first
bEnemiesTravelToLocation = false
; arrows and bolts come off in every OStim scene and go back on after
bSceneAmmoOff = true

[Furniture]
; use furniture at all
bEnableFurniture = true
; only beds count as furniture
bFurnitureOnlyBeds = true
; 0 = anywhere, 1 = any furniture, 2 = beds only
iScenesStartIn = 2
; enemies ignore the ScenesStartIn rule
bEnemiesIgnoreScenesStartInRules = false

[Locations]
; followers never start scenes in dungeons
bFollowersNoScenesDungeons = true
; no scenes in city and town locations
bNoScenesInTowns = true
; no scenes in guild halls
bNoScenesInGuilds = true
; no scenes in inns
bNoScenesInInns = false

[Limits]
; minimum relationship rank between two NPCs, -4..4
iMinRelation = 3
; scenes running at the same time, 1..4
iMaxScenes = 2
; 1..10
iMaxFollowerScenesPerNight = 2
; 1..20
iMaxEnemyScenesPerNight = 3
; hour the night starts, 24-hour clock (20 = 8 PM)
iMinNight = 20
; hour the night ends (4 = 4 AM)
iMaxNight = 4
; seconds between scans, 10..120
iScanFreq = 15

[Weights]
; male-female pair weight 0..100
iWeightMF = 100
; female-female pair weight 0..100
iWeightFF = 0
; male-male pair weight 0..100
iWeightMM = 0

[Relationships]
; off = committed NPCs never stray (not in scenes, not off-screen) and nothing counts as cheating; on = the stray chance below applies
bInfidelity = true
; on = Khajiit and Argonians only have children with their own kind (lore); off = any two people can
bBeastChildrenOwnKind = true
; % chance per scan that a married/courting NPC strays (0 = faithful; scans run every few seconds, so keep it small)
fStrayChance = 0.3
; multiplier when Lover's Ledger shows the NPC has strayed before
fStrayRepeatMult = 2
; weight of the Lover's Ledger pair score when choosing a partner
fHistoryWeight = 1
; base score every allowed stranger pair gets (0 = only pairs with history)
fStrangerBaseScore = 1
; exclude family of any degree, blood and in-law (Relations Finder)
bUseRelationsFinderFamily = true
; prefer pairs with history (Lover's Ledger)
bUseLoversLedger = true

[Ladder]
; NPC-to-NPC relationship ladder on/off
bLadderEnabled = true
; the game's relationship rank follows the couple: dating = confidant, engaged = ally, married = lover (never lowers a higher rank); a breakup drops it to acquaintance
bRankFollowsLadder = true
; follow other mods: partners whose relationship rank a mod drops to acquaintance split up, two people a mod makes lovers start dating, a new spouse record marries them
bWatchRelationships = true
; 0.21.0: marriages the game already had can end like ours (cheating, cold divorce); protected couples never
bGameMarriagesCanEnd = false
; new couples only form between NPCs you have met (talked to, or been near); couples that already exist carry on. Off = anyone in Skyrim can get together off-screen
bOnlyMetCouples = false
; % chance a meeting between two unattached people starts anything at all (archetypes tilt it: romantics more, the independent less, a big class gap less)
fSparkChance = 15.0
; % of new couples that skip seeing each other and start dating straight away (romantics and the jealous more, the independent less)
fDirectDatingShare = 25.0
; % chance per meeting, once the encounter and day thresholds are met, that a couple moves up a stage
fPromoteChance = 35.0
iCandidateEncounters = 3
; and at least this many days since they met
iCandidateMinDays = 21
; encounters before candidate -> engaged
iEngagedEncounters = 6
; and at least this many days as candidates
iEngagedMinDays = 14
; engaged -> married after this many days
iMarriedAfterDays = 10
; engaged couples marry at the Temple of Mara in Riften two days after the engagement time is up (in the afternoon, noon to 17:00); you get word of it, and if you are there Maramal holds the ceremony
bRealWeddings = false
; weddings take turns: at most one couple marries every this many days (a couple whose time is up waits for the next free day)
iWeddingGapDays = 7
; real weddings: guests besides the children of either partner (children always come): close family first (parents, siblings, grandparents), then friends; 0..12
iWeddingGuests = 6
; real weddings: base % chance one partner never comes and the other is left at the altar (+10 per stray, +10 if they are not close; at most 40); 0 = never
iAltarNoShowChance = 3
; real weddings: you were invited and did not come - the wedding is put off a day, up to this many times; 0 = it goes ahead without you
iWeddingWaitDays = 3
; real weddings: guests sit on the temple benches during the ceremony
bSeatedGuests = true
; real weddings: attacking the bride, the groom or the priest during the ceremony stops the wedding (a new date follows)
; married or engaged NPCs near you now and then tell a friend or relative about their partner or their wedding (voice lines must be on)
bFriendChats = true
bObjectionStopsWedding = true
; strays before a mod-made couple breaks up
iStrayStrikes = 2
; closeness added per encounter (0..100)
fClosenessGain = 25
; closeness lost per stray
fStrayPenalty = 40
; multiplies every day threshold (2 = slow, 0.5 = fast)
fWorldPace = 1
; a widowed NPC takes no new partner for this many days (x world pace; romantics longer, the independent shorter)
iMourningDays = 90

[Simulation]
; off-screen encounters while the player is elsewhere
bSimulationEnabled = true
; % per pair per simulated day, before multipliers
fDailyChance = 0.25
; chance factor for other places in the same hold (0 = own community only)
fSameHoldFactor = 0.5
; most missed days simulated per catch-up
iCatchUpCapDays = 30
; closeness lost per day without an encounter
fDriftPerDay = 1.5
; cold + strayed married pairs (made by this mod) divorce after this many days
iColdDaysBeforeDivorce = 60
; pace cap for new courting couples per community per 30 days (0 = none)
iMaxNewCouplesPerCommunityPerMonth = 2
; likely partners considered per NPC per day
iShortlist = 5
; simulated encounters are written to Lover's Ledger
bWriteLoversLedger = true

[Archetypes]
; read social class / skill / temperament from M.A.R.A.S when it is installed
bUseMarasArchetypes = true
; the player's fiances/spouses may have NPC romances off-screen: 0 never, 1 only spouses in M.A.R.A.S's open-relationship faction, 2 always
iPlayerPartnerRomances = 0

[Amulet]
; Amulet of Mara wearers count as looking for marriage
bAmuletEnabled = true
; interest multiplier when either single NPC wears one
fLookingMultiplier = 2
; NPC-NPC marriage removes the amulet, the giver spell and the marriage faction
bManageMarriedAmulets = true
; no amulet-giver mod present: this mod hands out a few Amulets of Mara itself (and takes them back on pairing)
bOwnAmulets = true
; % of eligible singles that may wear one
fOwnAmuletShare = 15

[Letters]
; courier letters about couples close to the player
bLettersEnabled = true
; vanilla relationship rank to the player needed for a letter (3 = ally, 4 = lover)
iLetterMinRank = 3
; an NPC the player courts in M.A.R.A.S writes about an NPC romance: 0 never, 1 when they start courting, 2 when engaged, 3 when married
iCandidateLetterStage = 2
; on-screen messages about NPC couples: 0 none (letters only), 1 friends of yours and NPCs you are courting, 2 every couple
iNotifications = 1
; notification when a couple close to the player strays
bGossip = true

[Pregnancy]
; simulated encounters are handed to the installed pregnancy engine (Beeing Female NG, Fertility Mode, FM Reloaded) through the FertilityModeAddSperm mod event
bPregnancyEvents = true
; 0.21.3: no children for vampires (until cured), automatons and androids from follower mods; Khajiit and Argonians only with their own kind - this mod's couples and Beeing Female's own scenes (the player's too)
bPregnancyRules = true
; 0.21.4: Beeing Female (baby item births) only turns a baby item into a child when the player is the father; on = babies of two NPCs grow into children on the same clock (its Mature time), mothers near you
bHatchNpcBabies = true
; 0.24.0: Beeing Female baby items (every baby, yours too) are carried for BabyCarriedDays, then live away from home (with kin, a temple, a wet nurse...) until ChildAppearsDays after birth, then come home as a child beside a parent; parents tell you where the child is. Off = the 0.21.4 behaviour (HatchNpcBabies)
bBabyStages = true
; baby stages: game days the baby item stays with its mother (1..3650; 365 = a year)
iBabyCarriedDays = 365
; baby stages: game days after birth when the child comes home (must be after BabyCarriedDays; 1642 = 4.5 years)
iChildAppearsDays = 1642

[Voice]
; couples near you greet each other, say goodbye and react to engagements and breakups with vanilla voice lines; a partner who sees a stray reacts
bVoiceLines = true
; game hours before the same couple speaks again
fVoiceCooldownHours = 3.0
; 0.23.0: parents, children, siblings and grandparents near you now and then say an everyday line to each other (vanilla lines and voices, never anything romantic; voice lines must be on)
bFamilyChats = true

[Home]
; married partners who live apart spend the night (21:00-07:00) around the shared home and may use a free bed there; never followers or guards
bSleepOvers = false
; dating and engaged couples who live in the same town meet in the evening (18:00-22:00): one goes to the other and spends the evening near them; never followers or guards; quests always win
bDateNights = false
; % chance each evening that a couple has a date night, 0..100
iDateNightChance = 30
; married couples who live apart in the same town: the spouse moves in for the evenings and nights (19:00-07:00), joins the house (its beds) and keeps their day job; a widow keeps the house; never followers or guards; quests always win
bHouseholds = false
; with Households: the couple's Beeing Female children live in the home too - out in town by day, home from 19:00
bHouseholdChildren = true
; with Households: some evenings (DateNightChance) the couple goes to the town inn together from 19:00 to 22:00
bNightsOut = true

[Advanced]
; verbose furniture-guard lines in the Papyrus log
bFurnitureGuardDebug = false
; on-screen message for every simulation and ladder event - testing only
bDebugNotifications = false
